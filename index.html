        <div class="slit" style="left: 115px; top: 488.25px; width: 20px"></div>

    <script>
      const container = document.getElementById("container");
      const BASE_WIDTH = 1920;
      const BASE_HEIGHT = 1080;

      // Throttled resize using requestAnimationFrame
      let isScaling = false;

      function resizeContainer() {
        if (isScaling) return;
        isScaling = true;

        requestAnimationFrame(() => {
          const scaleX = window.innerWidth / BASE_WIDTH;
          const scaleY = window.innerHeight / BASE_HEIGHT;
          const scale = Math.min(scaleX, scaleY);

          // Using translate3d forces subpixel hardware compositing on the GPU
          container.style.transform = `translate3d(-50%, -50%, 0) scale(${scale})`;
          isScaling = false;
        });
      }

      window.addEventListener("resize", resizeContainer, { passive: true });
      resizeContainer();

      //Sweep Lines
      const radarPanel = document.getElementById("radar-panel");
      const TOTAL_LINES = 20;
      const SWEEP_SPAN = 45;
      const fragment = document.createDocumentFragment();

      for (let i = 0; i < TOTAL_LINES; i++) {
        const line = document.createElement("div");
        line.className = "rline";

        const angle = -((i / (TOTAL_LINES - 1)) * SWEEP_SPAN);
        const opacity = Math.pow(1 - i / TOTAL_LINES, 2);

        line.style.opacity = opacity.toFixed(4);
        line.style.setProperty("--start-angle", `${angle.toFixed(2)}deg`);

        fragment.appendChild(line);
      }

      // Single paint call for all lines
      radarPanel.appendChild(fragment);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/typed.js@2.1.0/dist/typed.umd.js"></script>
    <script src="game.js"></script>
    <script src="boats.js"></script>
